<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whats for Dinner</title>
    <style>
        :root {
            --primary: #ff4b4b;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --secondary-text: #aaaaaa;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-nav {
            background-color: #333;
            color: #fff;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .btn-nav:hover { background-color: #444; }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            position: relative;
            min-height: 0;
        }

        /* Views */
        .view {
            display: none;
            width: 100%;
            max-width: 400px;
            height: 100%;
            flex-direction: column;
        }

        .view.active {
            display: flex;
        }

        /* Swipe Card Style */
        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            perspective: 1000px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            height: 65vh;
            max-height: 550px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: absolute;
            will-change: transform;
            cursor: grab;
            border: 1px solid var(--border);
        }

        .card:active {
            cursor: grabbing;
        }

        .card img {
            width: 100%;
            height: 75%;
            object-fit: cover;
            pointer-events: none;
        }

        .card-info {
            padding: 15px;
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
        }

        .card-info h2 {
            font-size: 1.5rem;
        }

        /* Settings & Manage Lists */
        .form-group {
            margin-bottom: 10px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
        }

        .btn-secondary {
            background-color: #4CAF50;
            color: white;
            width: 100%;
            padding: 15px;
            margin-top: 10px;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            width: 100%;
            padding: 15px;
            margin-top: 10px;
        }

        .btn-delete {
            background-color: #ff4b4b;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        ul.styled-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            margin: 15px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
        }

        ul.styled-list li {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        ul.styled-list li:last-child {
            border-bottom: none;
        }

        ul.styled-list li img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        ul.styled-list li strong {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            text-align: center;
            color: var(--secondary-text);
            margin-top: 50px;
        }

        h2 { margin-bottom: 10px; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <h1>Whats for Dinner</h1>
        <div class="nav-buttons">
            <button class="btn-nav" onclick="startOver()">Home</button>
            <button class="btn-nav" onclick="openManageView()">Manage</button>
            <button class="btn-nav" onclick="switchView('settings-view')">⚙️</button>
        </div>
    </header>

    <main>
        <div id="swipe-view" class="view active">
            <div class="card-container">
                <div class="card" id="current-card">
                    <img id="restaurant-img" src="" alt="Restaurant Image">
                    <div class="card-info">
                        <h2 id="restaurant-name">Loading...</h2>
                    </div>
                </div>
                <div id="no-cards-msg" class="empty-state" style="display:none;">
                    <h2>No more restaurants!</h2>
                    <p>Check your results.</p>
                </div>
            </div>
        </div>

        <div id="results-view" class="view">
            <h2>Your Matches</h2>
            <ul id="yesses-list" class="styled-list"></ul>
            <button class="btn-secondary" onclick="narrowDown()">Narrow it down!</button>
            <button class="btn-primary" onclick="startOver()" style="margin-top: 10px;">Restart from scratch</button>
        </div>

        <div id="manage-view" class="view" style="overflow-y: auto; padding-bottom: 20px;">
            <h2>Add New Place</h2>
            <div class="form-group">
                <input type="text" id="new-name" placeholder="Restaurant Name (e.g. McDonald's)">
            </div>
            <div class="form-group">
                <input type="text" id="new-url" placeholder="Image URL (http://...)">
            </div>
            <button class="btn-primary" onclick="addRestaurant()">Add Restaurant</button>
            
            <hr>
            
            <h2>Your Food Stack</h2>
            <p style="color: var(--secondary-text); font-size: 0.9rem; margin-bottom: 10px;">Here is everything currently in your rotation.</p>
            <ul id="manage-list" class="styled-list" style="flex: none; max-height: 400px;"></ul>
        </div>

        <div id="settings-view" class="view">
            <h2>Data Management</h2>
            <p style="margin-bottom: 15px; color: var(--secondary-text); font-size: 0.9rem;">Backup your list of places or restore an old list.</p>
            <button class="btn-outline" onclick="exportData()">📋 Copy My Data</button>
            <button class="btn-outline" onclick="importData()">📥 Import Data</button>
            
            <hr>
            <h2>Factory Reset</h2>
            <button class="btn-outline" onclick="resetToDefaults()" style="color: #ff4b4b; border-color: #3a1c1c;">🔄 Reset to Default Places</button>
        </div>
    </main>

    <script>
        // --- DATA SETUP ---
        const defaultRestaurants = [
            { name: "McDonald's", image: "https://images.unsplash.com/photo-1619985732152-7b561c71dddc?auto=format&fit=crop&w=600&q=80" },
            { name: "Local Pizza", image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80" },
            { name: "Sushi Spot", image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=600&q=80" },
            { name: "Burger King", image: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=600&q=80" }
        ];

        let allRestaurants = [];
        let currentQueue = [];
        let yesses = [];

        // --- SWIPE LOGIC VARIABLES ---
        const cardEl = document.getElementById('current-card');
        let isDragging = false;
        let startX = 0;
        let currentX = 0;

        // --- INITIALIZATION ---
        function initApp() {
            loadRestaurants();
            startOver();
            setupSwipe();
        }

        // Now saves the ENTIRE list, not just custom ones
        function loadRestaurants() {
            const saved = localStorage.getItem('whatsForDinner_list');
            if (saved && saved !== "[]") {
                allRestaurants = JSON.parse(saved);
            } else {
                allRestaurants = [...defaultRestaurants];
                saveRestaurants();
            }
        }

        function saveRestaurants() {
            localStorage.setItem('whatsForDinner_list', JSON.stringify(allRestaurants));
        }

        // --- CORE LOGIC ---
        function startOver() {
            if(allRestaurants.length === 0) {
                alert("You don't have any restaurants in your list! Go to Manage to add some.");
                openManageView();
                return;
            }
            currentQueue = [...allRestaurants];
            yesses = [];
            shuffleArray(currentQueue);
            switchView('swipe-view');
            renderCard();
        }

        function narrowDown() {
            if (yesses.length === 0) {
                alert("You didn't say yes to anything! Restarting from scratch.");
                startOver();
                return;
            }
            if (yesses.length === 1) {
                alert(`You only have one choice left! Looks like you're eating at ${yesses[0].name}!`);
                return;
            }
            currentQueue = [...yesses];
            yesses = [];
            shuffleArray(currentQueue);
            switchView('swipe-view');
            renderCard();
        }

        function renderCard() {
            const noCardsMsg = document.getElementById('no-cards-msg');
            
            cardEl.style.transition = 'none';
            cardEl.style.transform = 'translate(0px, 0px) rotate(0deg)';
            cardEl.style.opacity = '1';

            if (currentQueue.length === 0) {
                cardEl.style.display = 'none';
                noCardsMsg.style.display = 'block';
                showResults();
                return;
            }

            cardEl.style.display = 'flex';
            noCardsMsg.style.display = 'none';

            const current = currentQueue[0];
            document.getElementById('restaurant-img').src = current.image;
            document.getElementById('restaurant-name').innerText = current.name;
        }

        function vote(isYes) {
            const current = currentQueue.shift();
            if (isYes) yesses.push(current);
            renderCard();
        }

        function animateVote(isYes) {
            const moveOutWidth = window.innerWidth;
            cardEl.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
            cardEl.style.opacity = '0';
            
            if (isYes) {
                cardEl.style.transform = `translate(${moveOutWidth}px, 50px) rotate(30deg)`;
            } else {
                cardEl.style.transform = `translate(-${moveOutWidth}px, 50px) rotate(-30deg)`;
            }

            setTimeout(() => {
                vote(isYes);
            }, 400);
        }

        function showResults() {
            const listEl = document.getElementById('yesses-list');
            listEl.innerHTML = '';

            if (yesses.length === 0) {
                listEl.innerHTML = '<li style="justify-content:center; color:var(--secondary-text);">No matches yet!</li>';
            } else {
                yesses.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `<img src="${item.image}" alt="${item.name}"> <strong>${item.name}</strong>`;
                    listEl.appendChild(li);
                });
            }
            switchView('results-view');
        }

        // --- SWIPE EVENT HANDLERS ---
        function setupSwipe() {
            cardEl.addEventListener('touchstart', handleDragStart);
            document.addEventListener('touchmove', handleDragMove, { passive: false });
            document.addEventListener('touchend', handleDragEnd);

            cardEl.addEventListener('mousedown', handleDragStart);
            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('mouseup', handleDragEnd);
        }

        function handleDragStart(e) {
            isDragging = true;
            startX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
            cardEl.style.transition = 'none';
        }

        function handleDragMove(e) {
            if (!isDragging) return;
            // Prevent default scrolling behavior when swiping
            if(e.cancelable) e.preventDefault(); 
            
            const x = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
            currentX = x - startX;
            
            const rotate = currentX * 0.05;
            cardEl.style.transform = `translate(${currentX}px, 0) rotate(${rotate}deg)`;
        }

        function handleDragEnd() {
            if (!isDragging) return;
            isDragging = false;

            const threshold = window.innerWidth * 0.25;

            if (currentX > threshold) {
                animateVote(true);
            } else if (currentX < -threshold) {
                animateVote(false);
            } else {
                cardEl.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                cardEl.style.transform = 'translate(0px, 0px) rotate(0deg)';
            }
            currentX = 0;
        }

        // --- MANAGE & SETTINGS ---
        function openManageView() {
            renderManageList();
            switchView('manage-view');
        }

        function renderManageList() {
            const listEl = document.getElementById('manage-list');
            listEl.innerHTML = '';
            
            if(allRestaurants.length === 0) {
                listEl.innerHTML = '<li style="justify-content:center; color:var(--secondary-text);">Your list is empty!</li>';
                return;
            }

            allRestaurants.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <strong>${item.name}</strong>
                    <button class="btn-delete" onclick="deleteRestaurant(${index})">Delete</button>
                `;
                listEl.appendChild(li);
            });
        }

        function addRestaurant() {
            const nameInput = document.getElementById('new-name');
            const urlInput = document.getElementById('new-url');
            const name = nameInput.value.trim();
            const url = urlInput.value.trim();

            if (!name || !url) {
                alert("Please enter both a name and an image URL.");
                return;
            }

            allRestaurants.push({ name: name, image: url });
            saveRestaurants();

            nameInput.value = '';
            urlInput.value = '';
            
            renderManageList();
            alert(`${name} added!`);
        }

        function deleteRestaurant(index) {
            const place = allRestaurants[index];
            if(confirm(`Are you sure you want to delete ${place.name}?`)) {
                allRestaurants.splice(index, 1);
                saveRestaurants();
                renderManageList();
            }
        }

        function exportData() {
            if (allRestaurants.length === 0) {
                alert("You don't have any restaurants saved to export.");
                return;
            }
            
            const data = JSON.stringify(allRestaurants);
            navigator.clipboard.writeText(data).then(() => {
                alert("Data copied to clipboard! Paste it somewhere safe.");
            }).catch(err => {
                alert("Your browser blocked the clipboard. Here is the raw data:\n\n" + data);
            });
        }

        function importData() {
            const input = prompt("Paste your previously copied data here:");
            if (!input) return;
            
            try {
                const parsed = JSON.parse(input);
                if (Array.isArray(parsed)) {
                    allRestaurants = parsed;
                    saveRestaurants();
                    alert("Data imported successfully!");
                    startOver();
                } else {
                    alert("Invalid data format.");
                }
            } catch(e) {
                alert("Error importing data. Make sure you pasted exactly what was copied.");
            }
        }

        function resetToDefaults() {
            if(confirm("Are you sure? This will wipe your current list and restore the original 4 default places.")) {
                allRestaurants = [...defaultRestaurants];
                saveRestaurants();
                alert("Restored to defaults!");
                startOver();
            }
        }

        // --- UTILS ---
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
